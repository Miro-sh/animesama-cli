name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/animesama
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync version with tag
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  aur:
    name: Update AUR package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    needs: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          pacman -Syu --noconfirm --needed git openssh curl sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          cp PKGBUILD /home/builder/
          chown -R builder:builder /home/builder

      - name: Update PKGBUILD and regenerate .SRCINFO
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="https://github.com/Miro-sh/animesama-cli/archive/refs/tags/v${VERSION}.tar.gz"
          SHA=$(curl -Lfs "$TARBALL" | sha256sum | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" /home/builder/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" /home/builder/PKGBUILD
          cd /home/builder
          su builder -c "makepkg --printsrcinfo" > .SRCINFO
          cp PKGBUILD .SRCINFO "$GITHUB_WORKSPACE/"

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=accept-new"
          git clone ssh://aur@aur.archlinux.org/animesama-cli.git /tmp/aur
          cp /home/builder/PKGBUILD /home/builder/.SRCINFO /tmp/aur/
          cd /tmp/aur
          git config user.name "Miro-sh"
          git config user.email "65116975+Miro-sh@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${GITHUB_REF_NAME#v}" || echo "No changes"
          git push

      - name: Upload PKGBUILD artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgbuild
          path: |
            PKGBUILD
            .SRCINFO
          retention-days: 1

  sync-pkgbuild:
    name: Commit PKGBUILD back to this repo
    runs-on: ubuntu-latest
    needs: aur
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkgbuild

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "chore(aur): bump to ${GITHUB_REF_NAME#v}" || echo "No changes"
          git push origin HEAD:master

  packages:
    name: Build deb/rpm/apk and publish repos to GitHub Pages
    runs-on: ubuntu-latest
    needs: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the release in the pip index
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 40); do
            if curl -fs "https://pypi.org/simple/animesama/" | grep -q "animesama-${VERSION}.tar.gz"; then
              echo "Release available in the pip index"
              exit 0
            fi
            sleep 15
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package root
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkgroot/usr/share/animesama-cli pkgroot/usr/bin
          python -m pip install --target=pkgroot/usr/share/animesama-cli \
            --only-binary=:all: --platform=any --abi=none --python-version=39 --no-deps \
            "animesama==$VERSION" requests beautifulsoup4 soupsieve textual rich pygments \
            platformdirs typing_extensions markdown-it-py mdurl "linkify-it-py<3" \
            uc-micro-py mdit-py-plugins urllib3 certifi idna charset-normalizer
          printf '#!/bin/sh\nexec python3 /usr/share/animesama-cli/anime_sama.py "$@"\n' > pkgroot/usr/bin/animesama-cli
          chmod +x pkgroot/usr/bin/animesama-cli

      - name: Install nfpm
        run: |
          URL=$(curl -fs https://api.github.com/repos/goreleaser/nfpm/releases/latest | grep -o 'https://[^"]*Linux_x86_64\.tar\.gz"' | tr -d '"' | head -1)
          curl -Lfs "$URL" -o /tmp/nfpm.tar.gz
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build deb/rpm/apk packages
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          nfpm package --config nfpm.yaml --packager deb --target dist/
          nfpm package --config nfpm.yaml --packager rpm --target dist/
          nfpm package --config nfpm.yaml --packager apk --target dist/
          ls -la dist/

      - name: Install repo tools
        run: sudo apt-get update && sudo apt-get install -y reprepro createrepo-c rpm

      - name: Import GPG signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build signed apt repository
        run: |
          KEYID=$(gpg --list-keys --with-colons | awk -F: '/^pub/ {print $5}')
          mkdir -p apt-repo/conf
          cat > apt-repo/conf/distributions <<EOF
          Origin: animesama-cli
          Label: animesama-cli
          Codename: stable
          Architectures: amd64
          Components: main
          Description: animesama-cli apt repository
          SignWith: ${KEYID}
          EOF
          reprepro -b apt-repo includedeb stable dist/*.deb
          mkdir -p site/apt
          cp -r apt-repo/dists apt-repo/pool site/apt/

      - name: Build signed rpm repository
        run: |
          KEYID=$(gpg --list-keys --with-colons | awk -F: '/^pub/ {print $5}')
          echo "%_signature gpg" > ~/.rpmmacros
          echo "%_gpg_name ${KEYID}" >> ~/.rpmmacros
          rpm --addsign dist/*.rpm
          mkdir -p site/rpm
          cp dist/*.rpm site/rpm/
          createrepo_c site/rpm
          cat > site/rpm/animesama.repo <<EOF
          [animesama]
          name=animesama-cli
          baseurl=https://miro-sh.github.io/animesama-cli/rpm
          enabled=1
          gpgcheck=1
          repo_gpgcheck=0
          gpgkey=https://miro-sh.github.io/animesama-cli/animesama.gpg
          EOF

      - name: Assemble site
        run: |
          cp animesama.gpg site/
          cp dist/*.deb dist/*.rpm dist/*.apk site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages

  homebrew:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    needs: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for the release on PyPI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 40); do
            if curl -fs "https://pypi.org/simple/animesama/" | grep -q "animesama-${VERSION}.tar.gz"; then
              echo "Release available in the pip index"
              exit 0
            fi
            sleep 15
          done
          echo "Release not found in the pip index after 10 minutes"
          exit 1

      - name: Generate formula
        run: |
          python -m venv venv
          for i in 1 2 3; do
            ./venv/bin/pip install animesama=="${GITHUB_REF_NAME#v}" && break
            sleep 15
          done
          ./venv/bin/python scripts/generate_homebrew_formula.py "${GITHUB_REF_NAME#v}" Formula
          cat Formula/animesama.rb

      - name: Push to homebrew-tap
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HOMEBREW_TAP_SSH_KEY" > ~/.ssh/brew
          chmod 600 ~/.ssh/brew
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/brew -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:Miro-sh/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp Formula/animesama.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/animesama.rb
          git commit -m "animesama ${GITHUB_REF_NAME#v}" || echo "No changes"
          git push
